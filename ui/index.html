<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WAVE</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Painted before any script runs: the window shows this while the app loads its last project. -->
    <style>
      html, body { margin: 0; height: 100%; background: #0e1013; }
      .boot { position: fixed; inset: 0; display: grid; place-items: center; }
      .boot i { display: block; width: 120px; height: 3px; border-radius: 3px; background: #232a34; overflow: hidden; }
      .boot i::after { content: ""; display: block; width: 40%; height: 100%; background: #8794a8; animation: boot 1.1s ease-in-out infinite; }
      @keyframes boot { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .boot i::after { animation: none; width: 100%; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" role="progressbar" aria-label="Loading"><i></i></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
