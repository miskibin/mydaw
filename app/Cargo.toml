[package]
name = "wave-app"
description = "WAVE: the desktop app (Tauri shell around the engine)."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "wave_app"
path = "src/lib.rs"

[[bin]]
name = "wave-app"
path = "src/main.rs"

[features]
# Set by the Tauri CLI for production builds (serve ../ui/dist instead of the dev server).
custom-protocol = ["tauri/custom-protocol"]
# ASIO host on Windows. Needs LLVM/Clang; cpal fetches the Steinberg SDK (or CPAL_ASIO_DIR).
asio = ["wave-audio-io/asio"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
wave-engine.workspace = true
wave-rmvpe.workspace = true
wave-audio-io.workspace = true
wave-session.workspace = true
wave-midi-in.workspace = true
wave-cli = { path = "../crates/cli" }
wave-vst3 = { path = "../crates/vst3-host" }
wave-plugin-windows = { path = "../crates/plugin-windows" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde.workspace = true
serde_json.workspace = true
parking_lot.workspace = true
log.workspace = true
ureq.workspace = true
sha2.workspace = true
libc = "0.2"
base64.workspace = true
tempfile = "3"

[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = "2.5"
