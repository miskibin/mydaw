[package]
name = "mydaw-app"
description = "MYDAW shell: boots the microkernel, registers the plugin set, and hosts the webview UI over Tauri v2."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

# Library + thin binary: the whole shell lives in the library so it can be unit
# tested (`cargo test -p mydaw-app`), while `main.rs` only calls into it.
[lib]
name = "mydaw_app"
path = "src/lib.rs"

[[bin]]
name = "mydaw-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# --- workspace ---
mydaw-kernel.workspace = true
mydaw-rt-core.workspace = true
mydaw-ipc-bridge.workspace = true
mydaw-plugin-metering.workspace = true
mydaw-plugin-debug-tap.workspace = true
mydaw-plugin-test-tone.workspace = true
mydaw-plugin-instruments.workspace = true
mydaw-plugin-sampler.workspace = true
mydaw-plugin-sequencer.workspace = true
mydaw-plugin-audio-io.workspace = true
mydaw-plugin-host-clap.workspace = true
mydaw-plugin-host-vst3.workspace = true
mydaw-plugin-windows.workspace = true
# `main` dispatches the scan-worker protocol before anything else starts, so a
# shipped single binary is its own scan worker and no sidecar has to be bundled.
mydaw-plugin-scan.workspace = true

# --- shell ---
tauri = { version = "2", features = [] }
# Native Open/Save dialogs for the project file. Driven from Rust (see the
# project commands) rather than from the webview, so the UI's mock backend keeps
# working in a plain browser.
tauri-plugin-dialog = "2"
# The source slot swaps the head of the chain across the RT wall, the same way
# `rt-core` swaps a whole graph. `basedrop` comes via `mydaw-rt-core`'s re-export
# so the version stays pinned to the engine's; `rtrb` has no such re-export.
rtrb.workspace = true
serde.workspace = true
# The debug-capture command writes stats.json and the headless report.
serde_json.workspace = true
log.workspace = true
parking_lot.workspace = true
thiserror.workspace = true
env_logger = "0.11"

[dev-dependencies]
serde_json.workspace = true
parking_lot.workspace = true
# The fixture CLAP plugin: `tests/clap_graph.rs` runs a real plugin through the
# real graph, and depending on it here is what makes Cargo build its cdylib
# before these tests run.
mydaw-fixture-clap-gain = { path = "../test-fixtures/clap-gain" }
mydaw-plugin-test-tone.workspace = true
mydaw-plugin-debug-tap.workspace = true
mydaw-plugin-windows.workspace = true

[features]
# Set by the Tauri CLI for production builds; it switches `generate_context!`
# from "load the dev server URL" to "serve the embedded ../ui/dist". Also the way
# to run the shell against built assets without the CLI:
#   cargo run -p mydaw-app --features custom-protocol
# DO NOT REMOVE.
custom-protocol = ["tauri/custom-protocol"]

# The spike-3 smoke test drives the editor window the way a user's mouse would
# (a programmatic SetWindowPos) and reads back what the plugin painted.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }
