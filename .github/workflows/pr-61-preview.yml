name: Capture PR 61 export dialog
on:
  push:
    branches: [codex/pr-61-preview]
permissions:
  contents: write
jobs:
  screenshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm --dir ui install --frozen-lockfile
      - run: |
          npm install --prefix "$RUNNER_TEMP/wave-preview" playwright@1.58.2
          "$RUNNER_TEMP/wave-preview/node_modules/.bin/playwright" install --with-deps chromium
      - name: Exercise the dialog and capture it
        env:
          VITE_PERF: '1'
        run: |
          pnpm --dir ui dev --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/wave-vite.log" 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ > /dev/null && break; sleep 1; done
          mkdir -p screenshots
          node --input-type=commonjs <<'JS'
          const assert = require('node:assert/strict');
          const { chromium } = require(process.env.RUNNER_TEMP + '/wave-preview/node_modules/playwright');
          (async () => {
            const browser = await chromium.launch();
            try {
              const page = await browser.newPage({ viewport: { width: 1280, height: 780 }, deviceScaleFactor: 2 });
              await page.goto('http://127.0.0.1:4173/');
              await page.waitForFunction(() => window.__perf?.S.project.clips.length && document.querySelector('.boot') === null);
              await page.evaluate(async () => {
                await window.__perf.be().applyOps([{ op: 'setLoop', loop: { a: 4, b: 8 } }]);
                window.__perf.setU('exportOpen', true);
              });
              const dialog = page.getByRole('dialog', { name: 'Export', exact: true });
              await dialog.waitFor();
              const pick = name => dialog.getByRole('button', { name, exact: true });
              assert.equal(await pick('Wrap').count(), 0);
              await pick('Loop').click();
              await pick('Wrap').click();
              assert.match(await dialog.innerText(), /1\.9 s · 48000 Hz/);
              await pick('MP3').click();
              assert.equal(await pick('Wrap').count(), 0);
              await pick('WAV').click();
              assert.match(await pick('Wrap').getAttribute('class'), /\bon\b/);
              await pick('24-bit PCM').click();
              await pick('On').click();
              await page.evaluate(() => document.fonts.ready);
              await page.mouse.move(12, 12);
              await dialog.screenshot({ path: 'screenshots/pr-61-export.png', animations: 'disabled' });
            } finally {
              await browser.close();
            }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: pr-61-export-dialog
          path: screenshots/pr-61-export.png
      - name: Publish the image on this preview branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add screenshots/pr-61-export.png
          git commit -m 'Capture the updated export dialog'
          git push
