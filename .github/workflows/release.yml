name: Release

# Push a tag like v0.1.0 to build the Windows installer and publish it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Static MSVC runtime: the shipped exe needs no Visual C++ Redistributable.
  RUSTFLAGS: -C target-feature=+crt-static

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install UI dependencies
        run: pnpm --dir ui install --frozen-lockfile

      # Sample content is bundled into the installer (resources in tauri.conf.json).
      - name: Cache bundled assets
        uses: actions/cache@v4
        with:
          path: assets
          key: assets-${{ hashFiles('assets-manifest.json') }}

      # The script is idempotent, so a retry resumes where an upstream 503 stopped it.
      - name: Fetch bundled assets
        shell: pwsh
        run: |
          foreach ($i in 1..5) {
            pwsh scripts/fetch-assets.ps1
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds (15 * $i)
          }
          exit 1

      # The NSIS installer embeds the WebView2 bootstrapper, which installs the
      # WebView2 runtime on machines that lack it.
      # tauri.conf.json's beforeBuildCommand assumes the CLI runs inside app/, but
      # the CLI runs it from the repo root, so build the UI here and skip it.
      - name: Build UI
        run: pnpm --dir ui build

      - name: Build installer
        env:
          TAURI_CONFIG: '{"build":{"beforeBuildCommand":""}}'
        run: ui/node_modules/.bin/tauri.cmd build

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" target/release/bundle/nsis/*-setup.exe \
            --title "MYDAW ${{ github.ref_name }}" --generate-notes

      - name: Upload installer artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: mydaw-installer
          path: target/release/bundle/nsis/*-setup.exe
