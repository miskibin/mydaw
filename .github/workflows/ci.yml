name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux — format, lints, engine tests, UI tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - name: System libraries (ALSA, WebKitGTK)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libjack-jackd2-dev libdbus-1-dev libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      # a comma-decimal locale for app's locale_tests (it fails on Linux CI without one)
      - name: Comma-decimal locale (de_DE.UTF-8)
        run: sudo apt-get install -y locales && sudo locale-gen de_DE.UTF-8
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: ui/pnpm-lock.yaml }
      - run: pnpm --dir ui install --frozen-lockfile
      - run: pnpm --dir ui test
      - run: pnpm --dir ui build
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  windows:
    name: Windows — ASIO build + installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # cpal's asio-sys runs bindgen (needs libclang) and downloads the Steinberg ASIO SDK itself.
      - name: LLVM for bindgen
        run: |
          if (-not (Test-Path "C:\Program Files\LLVM\bin\libclang.dll")) { choco install llvm -y --no-progress }
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: ui/pnpm-lock.yaml }
      - run: pnpm --dir ui install --frozen-lockfile
      - run: pnpm --dir ui build
      - name: Tests
        run: cargo test --workspace
      - name: Build app with ASIO and the session CLI
        run: |
          cargo build --locked -p wave-app -p wave-cli --features asio,custom-protocol
      - name: Bundle NSIS installer
        working-directory: app
        run: pnpm dlx @tauri-apps/cli@2.12.4 bundle --debug --features asio --bundles nsis --ci
      - name: Test project file association
        shell: pwsh
        run: ./scripts/test-project-association.ps1
