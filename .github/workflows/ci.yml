name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Windows build, clippy, test
    # Windows-first per the design spec: WASAPI + WebView2 are the target
    # platform, so that is where the gates run.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install UI dependencies
        run: pnpm --dir ui install --frozen-lockfile

      # Must precede the Rust build: `tauri.conf.json` points `frontendDist` at
      # ui/dist, and tauri-build fails the app crate if that directory is absent.
      - name: Build UI
        run: pnpm --dir ui build

      - name: Build workspace
        run: cargo build --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The audio end-to-end test is `#[ignore]`d: GitHub runners have no output
      # device, and it would be audible if they did.
      - name: Test
        run: cargo test --workspace

      - name: Rustfmt
        run: cargo fmt --all --check
