[package]
name = "wave-audio-io"
description = "WAVE audio devices: WASAPI, ASIO (feature `asio`), CoreAudio, ALSA and JACK via cpal; duplex in/out feeding the engine."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Steinberg ASIO host (Windows). Needs LLVM/Clang for bindgen at build time; cpal's
# asio-sys fetches the SDK itself (or set CPAL_ASIO_DIR). Release builds turn it on.
asio = ["cpal/asio"]

[dependencies]
wave-engine.workspace = true
cpal.workspace = true
rtrb.workspace = true
serde.workspace = true
log.workspace = true

# Linux: the JACK host (libjack is loaded at run time, so a system without JACK or
# PipeWire's JACK library still starts on ALSA) and real-time priority for the ALSA
# audio thread, through RealtimeKit when the user has no rtprio limit of their own.
# Building needs the libjack and libdbus development packages.
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { workspace = true, features = ["jack", "realtime-dbus"] }

[dev-dependencies]
serde_json.workspace = true
