[package]
name = "mydaw-plugin-host-clap"
description = "MYDAW plugin: CLAP plugin discovery and hosting -- scans bundles and runs a plugin instance as an RT graph node."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mydaw-kernel.workspace = true
mydaw-rt-core.workspace = true
# Spike 3: the host opens the editor's window through this service.
mydaw-plugin-windows.workspace = true
clack-host.workspace = true
clack-extensions = { version = "0.1.1", features = [
    "clack-host",
    "audio-ports",
    "note-ports",
    "gui",
    "state",
    "timer",
] }
log.workspace = true
parking_lot.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The test fixture CLAP plugin. Depending on it here is not (only) about the two
# constants the tests import: it is what makes `cargo test` build the fixture's
# `cdylib` before the host tests run, so `target/<profile>/` really contains a
# loadable `.clap` bundle. Without the dependency edge Cargo has no reason to
# build a dynamic library nothing links against.
mydaw-fixture-clap-gain = { path = "../../test-fixtures/clap-gain" }
# The spectral analysis the instance tests use to prove that a state blob really
# changed what a plugin sounds like. Non-RT, test-only.
mydaw-plugin-debug-tap.workspace = true

# The GUI tests run their own message loop and inspect the plugin's child window
# (parent, text) through Win32 -- the only way to prove liveness without a human
# looking at the screen.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }
