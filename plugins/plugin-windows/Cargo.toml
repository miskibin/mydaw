[package]
name = "mydaw-plugin-windows"
description = "MYDAW plugin: native top-level windows for external plugin GUIs, pumped by the host's own message loop."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mydaw-kernel.workspace = true
log.workspace = true
parking_lot.workspace = true
thiserror.workspace = true

# Raw Win32. See the crate docs for why this is not `tao`.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

# The integration tests run their own `PeekMessage`/`DispatchMessage` loop over
# windows this crate created -- a deliberately *foreign* pump, standing in for
# tao's.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }
