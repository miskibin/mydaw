[package]
name = "mydaw-plugin-host-vst3"
description = "MYDAW plugin: VST3 plugin discovery and hosting -- scans modules and runs a plugin instance as an RT graph node."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

# The sacrificial process a scan opens modules in. `mydaw-app` can do the same
# job (its `main` calls the same dispatcher), so shipping this binary is
# optional; it exists because it starts in milliseconds rather than loading a
# webview, and because it is what the tests here spawn.
[[bin]]
name = "mydaw-vst3-scan-worker"
path = "src/bin/mydaw-vst3-scan-worker.rs"

[dependencies]
mydaw-kernel.workspace = true
mydaw-rt-core.workspace = true
mydaw-plugin-params.workspace = true
# Out-of-process scanning: the worker protocol, the metadata cache and the block
# list. Shared with the CLAP host, because a plugin crashing the scanner is not a
# format-specific problem.
mydaw-plugin-scan.workspace = true
# A scan result crosses a pipe as JSON and is cached as JSON.
serde.workspace = true
# Step 7: the host opens the editor's window through this service, exactly as
# `mydaw-plugin-host-clap` does.
mydaw-plugin-windows.workspace = true
# Raw COM-style bindings for the VST3 API (coupler-rs, MIT/Apache). There is no
# safe high-level VST3 host crate with a compatible licence; the safe layer over
# these bindings is this crate.
vst3 = "0.3"
log.workspace = true
parking_lot.workspace = true
thiserror.workspace = true

# A VST3 module is a Windows DLL. Loading one is `LoadLibraryW` +
# `GetProcAddress`, which is what `windows-sys` is already in the workspace for.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
] }

[dev-dependencies]
# The spectral analysis the hardware tests use to prove a real instrument
# actually produced the pitch it was asked for. Non-RT, test-only.
mydaw-plugin-debug-tap.workspace = true

# The GUI test runs its own message loop and inspects the plugin's child window
# through Win32 -- the only way to prove an editor is really embedded without a
# human looking at the screen.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }
