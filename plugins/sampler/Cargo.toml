[package]
name = "mydaw-plugin-sampler"
description = "MYDAW plugin: a manifest-driven sample-playback instrument, plus the fetcher that installs its bundled sample content."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mydaw-kernel.workspace = true
mydaw-rt-core.workspace = true
# The decode, the padding and the interpolation kernel, shared with the
# sequencer's audio clips.
mydaw-audio-file.workspace = true

parking_lot.workspace = true
thiserror.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
arc-swap.workspace = true

# Non-RT only: fetching happens on a worker thread the audio callback never
# touches. (The decode itself moved to `mydaw-audio-file`.)
ureq.workspace = true
sha2.workspace = true

[dev-dependencies]
# The spectral assertions measure what the sampler produces rather than
# asserting it by eye; `debug-tap` already owns the FFT the rest of the project
# reads. `hound` writes the synthetic WAVs the asset-free tests decode.
mydaw-plugin-debug-tap.workspace = true
hound.workspace = true
# `tests/factory_kits.rs` re-derives 808 Bass's root pitch from the installed
# recordings rather than trusting the number in the manifest -- with the same
# analyser the sample browser uses, so the two can never disagree.
mydaw-pitch-analysis.workspace = true
