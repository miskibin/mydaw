[package]
name = "mydaw-plugin-audio-io"
description = "MYDAW plugin: cpal output device, the real-time callback, and the graph/transport/meter plumbing behind it."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mydaw-kernel.workspace = true
mydaw-rt-core.workspace = true
mydaw-ipc-bridge.workspace = true
# For the `MeterTap` service type. The manifest dependency on "metering"
# guarantees the service exists by the time this plugin starts.
mydaw-plugin-metering.workspace = true
# For the `DebugTapHandoff` service type. Same story as metering: the manifest
# dependency on "debug-tap" guarantees the service exists when this plugin
# starts.
mydaw-plugin-debug-tap.workspace = true
# For the pattern channel and the scheduler. Not a manifest dependency: this is
# a type dependency only. The sequencer contributes no service the audio thread
# needs -- the RT side owns a `PatternSlot` created here, exactly like the graph
# and note queues, and the *pattern* it carries comes from the shell.
mydaw-plugin-sequencer.workspace = true
# For `cubic`, the interpolation kernel a recorded take is rate-converted with.
# The sampler plays pitched files through the same one; a take that used a
# different (worse) kernel would sound different from the same audio dropped in
# from disk.
mydaw-audio-file.workspace = true

# The ring between the capture callback and the recorder's worker. The output
# path gets its queues from `rt-core`; the input one is the only ring this crate
# builds itself, because nothing in the graph reads it.
rtrb.workspace = true

cpal.workspace = true
# cpal's own `realtime` feature is off (it is not a default), so promotion is
# ours to do -- from inside the callback, on the thread that actually runs it.
audio_thread_priority.workspace = true

log.workspace = true
parking_lot.workspace = true
thiserror.workspace = true

[features]
default = []
# cpal's ASIO host: Steinberg SDK + LLVM/Clang (bindgen). Off by default so
# CI and machines without LLVM still build. `choose_host(true)` falls back to
# WASAPI and explains itself when this is off or no driver is installed.
asio = ["cpal/asio"]

[dev-dependencies]
# The RT-path test drives a real node through `run_block`. No audio device is
# opened, so this suite runs on a headless CI machine.
mydaw-plugin-test-tone.workspace = true
# `tests/sequencer_engine.rs` renders a programmed beat through the real
# callback and measures where the hits landed. The drum kit is the instrument
# under the sequencer, and its onsets are what a grid can be checked against.
mydaw-plugin-instruments.workspace = true
# `tests/debug_tap_capture.rs` asserts that -inf dBFS survives serialisation.
serde_json.workspace = true
