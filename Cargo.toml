[workspace]
resolver = "2"
members = [
    "crates/engine",
    "crates/audio-io",
    "crates/session",
    "crates/cli",
    "app",
    "crates/audio-file",
    "crates/plugin-scan",
    "crates/vst3-host",
    "crates/plugin-windows",
    "crates/rmvpe",
    "crates/tune-bench",
    "crates/midi-in",
    "crates/perf",
]

[workspace.package]
edition = "2021"
version = "0.4.0"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
# --- real-time plumbing ---
rtrb = "0.4"            # lock-free SPSC ring: UI/engine thread <-> audio callback
# --- audio I/O ---
cpal = "0.18"           # WASAPI / ASIO (feature "asio") / CoreAudio / ALSA / JACK (Linux)
# --- decoding (non-RT only) ---
symphonia = { version = "0.6", default-features = false, features = ["flac", "wav", "pcm", "ogg", "vorbis"] }
minimp3 = "0.5"
hound = "3"
realfft = "3"
# --- library download ---
ureq = { version = "3", features = ["platform-verifier"] }
sha2 = "0.10"
# --- general ---
thiserror = "2"
log = "0.4"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
interprocess = "2"
uuid = { version = "1", features = ["v4"] }
dirs = "6"

wave-engine = { path = "crates/engine" }
wave-audio-io = { path = "crates/audio-io" }
wave-audio-file = { path = "crates/audio-file" }
wave-plugin-scan = { path = "crates/plugin-scan" }
wave-session = { path = "crates/session" }
wave-rmvpe = { path = "crates/rmvpe" }
wave-midi-in = { path = "crates/midi-in" }

[profile.dev]
opt-level = 1           # DSP in debug is unusably slow otherwise

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
