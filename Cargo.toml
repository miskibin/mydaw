[workspace]
resolver = "2"
members = ["crates/*", "plugins/*", "app", "test-fixtures/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"
publish = false

# Shared dependency versions. Member crates opt in with `dep.workspace = true`.
[workspace.dependencies]
# --- real-time plumbing ---
rtrb = "0.4"        # lock-free SPSC ring buffer (UI <-> RT thread)
basedrop = "0.1"    # defer deallocation off the RT thread
arc-swap = "1"      # atomic Arc publish; reserved for non-RT shared config snapshots
# --- audio I/O ---
cpal = "0.18"                    # cross-platform device I/O; WASAPI on Windows
audio_thread_priority = "0.37"   # promote the callback thread to MMCSS/Pro Audio
# MIDI input. WinMM on Windows (the default); listing creates a fresh client
# each time so virtual ports that appear after launch are visible without a
# restart. Hot-plug is polled -- WinMM does not notify.
midir = "0.11"
# --- plugin hosting ---
clack-host = "0.1"  # safe CLAP host bindings (discovery in Phase 0, hosting in spike 2)
# --- sampled instruments (non-RT only: decoding and fetching happen at load) ---
# `symphonia` decodes the FLAC/WAV the sampler's instruments ship as, and the
# WAV/FLAC/OGG a user drops on the playlist as an audio clip. Default features
# stay off: this is three codecs and two containers, not the whole media matrix,
# and every extra decoder is attack surface for a file we did not author. Ogg
# Vorbis is here because a bounce from another DAW or a downloaded loop is often
# one.
#
# **MP3 is decoded by `minimp3` in `mydaw-audio-file`**, not by this crate:
# `symphonia-bundle-mp3` has no released 0.6. The day it ships, the minimp3
# path can go and `"mp3"` can land here.
symphonia = { version = "0.6", default-features = false, features = [
    "flac",
    "wav",
    "pcm",
    "ogg",
    "vorbis",
] }
# `ureq` and not `reqwest`: the asset downloader is a blocking loop on its own
# thread, so an async runtime would be pure weight. `reqwest` appears in the
# lockfile but is not in this workspace's build graph, so it is not "free".
#
# `platform-verifier` pulls in `rustls-platform-verifier`, which validates the
# server chain against the **operating system's** trust store instead of the
# Mozilla roots `ureq` bundles by default. On a corporate network whose proxy
# terminates TLS and re-signs with a private CA, the bundled roots produce
# `invalid peer certificate: UnknownIssuer` for every URL -- while the machine
# itself trusts that CA perfectly well, because IT installed it. See
# `mydaw_plugin_sampler::download::tls_config`.
ureq = { version = "3", features = ["platform-verifier"] }
sha2 = "0.10"      # SHA-256 over every downloaded asset; pinned in assets-manifest.json
# --- analysis / debug harness (non-RT only) ---
realfft = "3"      # real-input FFT for capture spectra (wraps rustfft)
hound = "3"        # 32-bit float WAV writer/reader for captures
png = "0.18"       # PNG encoder; the rasteriser is ours (plotters is far too heavy)
# --- native windows (plugin GUIs) ---
# Raw Win32, not `tao`: plugin editor windows must be created on demand on the
# thread that already owns tao's message loop, which tao's own API does not
# expose. See `plugins/plugin-windows`.
windows-sys = "0.61"
# --- general ---
thiserror = "2"
log = "0.4"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"   # DTO wire-shape tests, and the debug-tap axis/stats sidecars

# --- internal crates ---
mydaw-kernel = { path = "crates/kernel" }
mydaw-rt-core = { path = "crates/rt-core" }
mydaw-ipc-bridge = { path = "crates/ipc-bridge" }
# Decoding one audio file into memory, shared by the sampler (an instrument's
# recordings) and the sequencer (an audio clip on the playlist).
mydaw-audio-file = { path = "crates/audio-file" }
mydaw-pitch-analysis = { path = "crates/pitch-analysis" }
# Onset detection and grid slicing behind the sample window's Slices mode.
mydaw-slice-analysis = { path = "crates/slice-analysis" }
# Out-of-process plugin scanning: the worker protocol, the metadata cache and the
# block list, shared by both plugin hosts.
mydaw-plugin-scan = { path = "crates/plugin-scan" }

# --- internal plugins (registered by hand in `app/main.rs`) ---
mydaw-plugin-metering = { path = "plugins/metering" }
mydaw-plugin-debug-tap = { path = "plugins/debug-tap" }
mydaw-plugin-test-tone = { path = "plugins/test-tone" }
mydaw-plugin-instruments = { path = "plugins/instruments" }
mydaw-plugin-effects = { path = "plugins/effects" }
mydaw-plugin-sampler = { path = "plugins/sampler" }
mydaw-plugin-sequencer = { path = "plugins/sequencer" }
mydaw-plugin-audio-io = { path = "plugins/audio-io" }
mydaw-plugin-midi-io = { path = "plugins/midi-io" }
mydaw-plugin-host-clap = { path = "plugins/host-clap" }
mydaw-plugin-host-vst3 = { path = "plugins/host-vst3" }
mydaw-plugin-windows = { path = "plugins/plugin-windows" }

[profile.release]
lto = "thin"
codegen-units = 1
