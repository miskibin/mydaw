[package]
name = "mydaw-fixture-clap-gain"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
clack-plugin = "0.1.1"
clack-extensions = { version = "0.1.1", features = ["clack-plugin", "audio-ports", "gui", "timer"] }

# The editor is raw Win32: a CLAP plugin embeds an HWND into the host window, so
# there is no toolkit here to hide behind. See src/gui.rs.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }
